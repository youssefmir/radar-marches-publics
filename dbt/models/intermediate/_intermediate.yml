version: 2

models:
  - name: int_attributions
    description: >
      Attributions nettoyées. Règles : R1 période (>= 2021-01-01, pas de date future) ; R2 dédoublonnage
      marché × titulaire ; R3 statut du montant ; R4 statut du nombre d'offres ; R5 contrôle SIRET (Luhn) ;
      R6 regroupement des procédures ; R7 normalisation de la nature.
    columns:
      - name: attribution_id
        data_tests: [unique, not_null]
      - name: montant_statut
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, absent, nul_ou_negatif, valeur_remplissage, aberrant]
      - name: offres_statut
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, absent, zero, hors_seuil]
      - name: nb_titulaires
        data_tests: [not_null]
  - name: int_titulaires
    columns:
      - name: titulaire_key
        data_tests: [unique, not_null]
  - name: int_concurrence_acheteur_cpv
    description: Intensité concurrentielle historique par acheteur × groupe CPV (3 chiffres).
    data_tests:
      - unique_combination:
          arguments:
            columns: [acheteur_id, groupe_cpv]
