[project]
name = "radar-marches-publics"
version = "1.0.0"
description = "Trouver, qualifier et prioriser les appels d'offres publics à partir de l'historique réel des attributions (DECP, BOAMP, SIRENE)."
authors = [{ name = "Youssef Mir" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "dbt-duckdb>=1.8",
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
  "pyyaml>=6",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["pipeline", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
