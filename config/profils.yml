# Pondérations du score hybride (somme = 1). Partie texte : poids égaux sémantique / lexical, car alpha = 0,5
# maximise le nDCG@10 sur l'échantillon de réglage (docs/evaluation-radar.md) ; les autres poids sont des choix métier explicites (docs/decisions.md).
poids:
  semantique: 0.20
  lexical: 0.20
  cpv: 0.25
  geographie: 0.15
  taille: 0.08
  concurrence: 0.06
  sortant: 0.06
